<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Offline · Memoraa</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: dark light; --bg: #0a0a0a; --fg: #f5f5f5; --muted: #9a9a9a; --line: #2a2a2a; }
      @media (prefers-color-scheme: light) { :root { --bg: #faf3e2; --fg: #141414; --muted: #6b6558; --line: #d9d0b8; } }
      * { box-sizing: border-box; border-radius: 0; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: var(--bg); color: var(--fg); font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      main { width: min(32rem, 100%); border: 1px solid var(--line); }
      .bar { padding: .5rem .8rem; border-bottom: 1px solid var(--line); color: var(--muted); font-size: .72rem; letter-spacing: .06em; }
      .body { padding: 1.5rem 1.2rem 1.6rem; }
      h1 { margin: 0 0 .6rem; font-size: 1.35rem; }
      h1::before { content: '> '; color: var(--muted); }
      p { margin: 0 0 1.1rem; color: var(--muted); font-size: .85rem; line-height: 1.6; }
      a, button { display: inline-block; padding: .55rem .9rem; border: 1px solid var(--fg); background: var(--fg); color: var(--bg); font: inherit; font-size: .8rem; font-weight: 700; text-decoration: none; cursor: pointer; }
      a.alt { background: transparent; color: var(--fg); border-color: var(--line); margin-left: .4rem; }
      i { display: inline-block; width: 8px; height: 8px; margin-right: .5rem; background: #d9a400; }
    </style>
  </head>
  <body>
    <main>
      <div class="bar"><i></i>~/memoraa/offline</div>
      <div class="body">
        <h1>You are offline</h1>
        <p>This page has not been saved on this device yet. Anything you have already opened still works: try the dashboard, or pick a chapter you have studied before. Your progress is stored on this device and will not be lost.</p>
        <button type="button" onclick="location.reload()">Try again</button>
        <a class="alt" href="/dashboard">Open dashboard</a>
      </div>
    </main>
    <script>addEventListener('online', function () { location.reload() })</script>
  </body>
</html>
